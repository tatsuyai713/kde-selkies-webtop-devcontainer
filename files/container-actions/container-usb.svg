<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs
     id="defs3051">
    <style
       type="text/css"
       id="current-color-scheme">
      .ColorScheme-Text {
        color:#232629;
      }
      </style>
  </defs>
  <!-- USB trident, drawn with the 1px lines of the Breeze 32px action icons -->
  <g class="ColorScheme-Text" style="fill:none;stroke:currentColor;stroke-width:1;stroke-linejoin:miter">
    <!-- arrow head and shaft -->
    <path d="M 12.5,8.5 L 16,3.5 L 19.5,8.5 Z" />
    <path d="M 16,8.5 L 16,24" style="stroke-width:2" />
    <!-- base -->
    <circle cx="16" cy="26" r="2.5" />
    <!-- left branch with the round end -->
    <path d="M 16,21.5 L 9.5,15 L 9.5,12" />
    <circle cx="9.5" cy="10" r="2" />
    <!-- right branch with the square end -->
    <path d="M 16,18.5 L 22.5,12 L 22.5,10" />
    <rect x="20.5" y="6.5" width="4" height="3.5" />
  </g>
</svg>
